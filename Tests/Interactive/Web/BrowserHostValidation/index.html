<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MonoGame.Web Browser Host Validation</title>
    <link rel="stylesheet" href="./host.css">
</head>
<body>
    <main
        id="monogame-host"
        data-application-name="MonoGame.Web Browser Host Validation"
        data-canvas-id="monogame-canvas"
        data-content-base-uri="./"
        data-status-id="monogame-host-status"
        data-runtime-script-uri="./AppBundle/_framework/dotnet.js"
        data-bootstrap-assembly-name="BrowserHostValidation.dll"
        data-bootstrap-type-name="BrowserHostValidation.BrowserHostValidationBootstrap"
        data-main-assembly-name="BrowserHostValidation.dll">
        <canvas
            id="monogame-canvas"
            width="1280"
            height="720"
            aria-label="MonoGame browser host validation canvas"></canvas>
        <p id="monogame-host-status" class="host-status" hidden role="alert"></p>
    </main>

    <noscript>
        <p class="noscript-banner">MonoGame.Web requires JavaScript.</p>
    </noscript>

    <script type="module" src="./main.js"></script>
</body>
</html>
